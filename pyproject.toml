[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p6ai"
version = "0.2.0"
description = "AI 驱动的 Primavera P6 Professional（独立版 SQLite）计划建库工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "P6AI Contributors" }]
keywords = ["primavera", "p6", "sqlite", "construction", "planning", "ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Construction",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
p6ai = "p6ai.cli:main"

[tool.setuptools]
packages = ["p6ai"]
